# ansible.cfg projektu (dzień 5) — ten sam projekt uruchamiasz lokalnie i z AWX.
[defaults]
# Domyślnie dev. Prod tylko jawnie: -i inventories/prod. AWX podaje inventory sam.
inventory = inventories/dev
roles_path = galaxy/roles
collections_path = galaxy/collections
# Hasła vault NIE w tym pliku: AWX ich nie ma i zatrzymałby się na brakującym pliku z hasłem.
# Lokalnie ustaw je w powłoce (np. w ~/.bashrc):
#   export ANSIBLE_VAULT_IDENTITY_LIST=dev@~/.vault_dev,prod@~/.vault_prod

[ssh_connection]
pipelining = True
