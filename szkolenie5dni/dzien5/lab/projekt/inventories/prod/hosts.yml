---
# Środowisko PROD (ROZWIĄZANIE dnia 4): grupy to warstwy aplikacji.
#
#   klient → web01: load balancer (nginx) → web02, web03: aplikacja (Apache) → web01: baza (MySQL)
#
# Host może należeć do kilku grup: web01 jest jednocześnie load balancerem i bazą danych.
# W produkcji każda warstwa to osobne maszyny; tu mamy trzy hosty.
all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/akademia_lab_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    ansible_python_interpreter: /usr/bin/python3

  # Dane połączenia — w jednym miejscu, niezależnie od tego, do których grup host należy
  hosts:
    web01:
      ansible_host: 127.0.0.1
      ansible_port: 2221
    web02:
      ansible_host: 127.0.0.1
      ansible_port: 2222
    web03:
      ansible_host: 127.0.0.1
      ansible_port: 2223

  children:
    loadbalancers:
      hosts:
        web01:
    databases:
      hosts:
        web01:
    appservers:
      hosts:
        web02:
        web03:          # L14, krok 5: skalowanie na trzeci host
