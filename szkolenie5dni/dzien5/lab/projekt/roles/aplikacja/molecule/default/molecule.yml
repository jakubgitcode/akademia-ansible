---
# L20, część B — test roli aplikacja w kontenerze (Molecule + Docker):
#   cd projekt/roles/aplikacja && molecule test
# Kontener z systemd (obraz z Docker Hub przygotowany do testów ról Ansible), bez bazy danych.
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: molecule-aplikacja
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    override_command: false        # zostaw polecenie obrazu: systemd jako proces 1
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: /usr/bin/python3
role_name_check: 1                 # nazwa roli bez przestrzeni nazw (aplikacja) — tylko ostrzeżenie
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - converge
    - idempotence
    - verify
    - destroy
