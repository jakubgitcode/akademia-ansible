# ansible.cfg — punkt startu dnia 4 (stan po dniu 3)
[defaults]
inventory = inventory/hosts.yml
# to samo w formacie INI: inventory = inventory/hosts.ini
# Role i kolekcje z Galaxy instalujemy do katalogu projektu (L12): każdy projekt ma swoje wersje.
# Własne role (katalog roles/ obok site.yml) Ansible znajduje bez tego ustawienia.
roles_path = galaxy/roles
collections_path = galaxy/collections

[ssh_connection]
pipelining = True
