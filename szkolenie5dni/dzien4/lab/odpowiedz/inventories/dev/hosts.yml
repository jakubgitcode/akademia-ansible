---
# Środowisko DEV (ROZWIĄZANIE dnia 4): cała aplikacja na jednym hoście web04.
# Ten sam site.yml i te same role co w prod; różnice opisują wyłącznie zmienne w group_vars tego katalogu.
all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/akademia_lab_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    ansible_python_interpreter: /usr/bin/python3

  hosts:
    web04:
      ansible_host: 127.0.0.1
      ansible_port: 2224

  children:
    loadbalancers:
      hosts:
        web04:
    databases:
      hosts:
        web04:
    appservers:
      hosts:
        web04:
