# ansible.cfg (ROZWIĄZANIE dnia 4)
[defaults]
# Domyślnie dev. Prod tylko jawnie: ansible-playbook -i inventories/prod site.yml
inventory = inventories/dev
roles_path = ../galaxy/roles
collections_path = ../galaxy/collections
# Hasła do vault: osobne dla dev i prod, w plikach poza repozytorium (L16).
# W labie oba są na Twojej maszynie; w firmie hasło prod ma tylko CI albo AWX.
vault_identity_list = dev@~/.vault_dev, prod@~/.vault_prod

[ssh_connection]
pipelining = True
