# Inventory dnia 3 w formacie INI (ROZWIĄZANIE, stan po L14): to samo co hosts.yml obok.
# Grupy to WARSTWY aplikacji, nie środowiska.
#
#   klient → web01: load balancer (nginx) → web02, web03: aplikacja (Apache) → web01: baza (MySQL)
#
# Host może należeć do kilku grup: web01 jest jednocześnie load balancerem i bazą danych.
# W produkcji każda warstwa to osobne maszyny; tu mamy trzy hosty.

# Dane połączenia — w jednym miejscu (hosty przed pierwszą sekcją — tak jak all.hosts w YAML), niezależnie od tego, do których grup host należy
web01 ansible_host=127.0.0.1 ansible_port=2221
web02 ansible_host=127.0.0.1 ansible_port=2222
web03 ansible_host=127.0.0.1 ansible_port=2223

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/akademia_lab_key
ansible_ssh_common_args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
ansible_python_interpreter=/usr/bin/python3

[loadbalancers]
web01

[databases]
web01

[appservers]
web02
# L14, krok 5: skalowanie na trzeci host
web03
