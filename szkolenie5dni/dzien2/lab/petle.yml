- name: Pętle w praktyce
  hosts: webservers
  become: true

  tasks:

    - name: Utwórz strukturę katalogów aplikacji
      # TODO: moduł ansible.builtin.file
      #       path: "{{ app_katalog }}/{{ item }}"
      #       state: directory, mode: '0755'
