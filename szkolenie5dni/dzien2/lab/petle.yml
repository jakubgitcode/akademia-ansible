    - name: Utwórz użytkowników aplikacji (tylko aktywnych)
      # TODO: moduł ansible.builtin.user
      #       name, comment, shell — z pól elementu pętli (item.name, item.comment, item.shell)
      #       state: present
      #       pętla po uzytkownicy_aplikacji
      #       warunek: tylko item.aktywny (pamiętaj o | bool)
      #       loop_control z label: "{{ item.name }}" (czytelny log)

    # GOTOWE — przeczytaj: register w pętli → wyniki są w liście .results
    - name: Sprawdź, czy są pliki konfiguracyjne
      ansible.builtin.stat:
        path: "/etc/szkolenie/{{ item }}"
      register: konfigi
      loop:
        - app.conf
        - app_env.conf
        - cache.conf

