---
# L6, część B — pliki konfiguracyjne (ROZWIĄZANIE)
# Uruchomienie:
#   ansible-playbook operacje_pliki_odpowiedz.yml

- name: Standard firmowy — pliki konfiguracyjne
  hosts: webservers
  become: true

  vars:
    katalog_konfiguracji: /etc/szkolenie
    plik_konfiguracji: /etc/szkolenie/app.conf

  tasks:

    - name: Firmowy MOTD z szablonu
      ansible.builtin.template:
        src: templates/motd.j2
        dest: /etc/motd
        owner: root
        group: root
        mode: '0644'
        backup: true

    - name: Katalog konfiguracji aplikacji
      ansible.builtin.file:
        path: "{{ katalog_konfiguracji }}"
        state: directory
        mode: '0755'

    # force: false → plik powstaje tylko RAZ; potem jego treścią zarządzają lineinfile i blockinfile.
    # Bez tej opcji copy przywracałby log_level=info przy każdym uruchomieniu, a lineinfile zmieniałby
    # go z powrotem na debug: dwie zmiany przy każdym uruchomieniu, nigdy changed=0.
    - name: Konfiguracja początkowa aplikacji (tylko gdy pliku jeszcze nie ma)
      ansible.builtin.copy:
        content: |
          # Konfiguracja aplikacji szkoleniowej
          app_name=sklep
          log_level=info
          port=8080
        dest: "{{ plik_konfiguracji }}"
        mode: '0644'
        force: false

    - name: Włącz logowanie debug
      ansible.builtin.lineinfile:
        path: "{{ plik_konfiguracji }}"
        regexp: '^log_level='
        line: log_level=debug

    - name: Dopisz sekcję monitoringu
      ansible.builtin.blockinfile:
        path: "{{ plik_konfiguracji }}"
        marker: "# {mark} ANSIBLE MANAGED — monitoring"
        block: |
          monitoring_enabled=true
          monitoring_port=9100

    - name: Pobierz gotową konfigurację z hostów
      ansible.builtin.fetch:
        src: "{{ plik_konfiguracji }}"
        dest: pobrane/

    - name: Odczytaj końcową zawartość pliku
      ansible.builtin.command: "cat {{ plik_konfiguracji }}"
      register: konfiguracja
      changed_when: false

    - name: Pokaż końcową konfigurację
      ansible.builtin.debug:
        msg: "{{ konfiguracja.stdout_lines }}"
