---
# Inventory dnia 2 — te same hosty co w dniu 1 (L1), już uzupełnione dla lab-env.
# Masz inne hosty? Skopiuj swoje inventory z dnia 1: cp ../dzien1/lab/inventory/hosts.yml inventory/
all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/akademia_lab_key
    # Hosty labowe dostają nowy klucz hosta przy każdym starcie, więc nie zapisujemy go w known_hosts.
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    ansible_python_interpreter: /usr/bin/python3

  children:
    webservers:
      children:
        dev:
          hosts:
            web01:
              ansible_host: 127.0.0.1
              ansible_port: 2221
        prod:
          hosts:
            web02:
              ansible_host: 127.0.0.1
              ansible_port: 2222
