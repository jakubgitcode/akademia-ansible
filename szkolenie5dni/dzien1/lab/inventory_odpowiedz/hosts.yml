---
# L1 — inventory (ROZWIĄZANIE dla środowiska lab-env: oba hosty na tym komputerze, różne porty SSH)
# Użycie zamiast własnego:  ansible all -i inventory_odpowiedz/hosts.yml -m ping
all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/akademia_lab_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    # Python na hostach podany wprost; bez tej linii Ansible przy każdym uruchomieniu ostrzega o wykrytym /usr/bin/python3.12
    ansible_python_interpreter: /usr/bin/python3

  children:
    webservers:
      children:
        dev:
          hosts:
            web01:
              ansible_host: 127.0.0.1
              ansible_port: 2221
        prod:
          hosts:
            web02:
              ansible_host: 127.0.0.1
              ansible_port: 2222
