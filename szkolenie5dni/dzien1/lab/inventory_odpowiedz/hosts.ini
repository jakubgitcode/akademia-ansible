# L1 — inventory w formacie INI (ROZWIĄZANIE dla lab-env): to samo co hosts.yml obok.
# Użycie zamiast własnego:  ansible all -i inventory_odpowiedz/hosts.ini -m ping

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/akademia_lab_key
ansible_ssh_common_args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
# Python na hostach podany wprost; bez tej linii Ansible przy każdym uruchomieniu ostrzega o wykrytym /usr/bin/python3.12
ansible_python_interpreter=/usr/bin/python3

[dev]
web01 ansible_host=127.0.0.1 ansible_port=2221

[prod]
web02 ansible_host=127.0.0.1 ansible_port=2222

[webservers:children]
dev
prod
