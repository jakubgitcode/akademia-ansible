---
# L1 — inventory: lista hostów, którymi zarządzamy, i sposób połączenia z nimi.
# Uzupełnij miejsca TODO. Dane połączenia dostaniesz od prowadzącego
# (na środowisku z lab-env są w pliku lab-env/inventory.yml).
all:
  vars:
    ansible_user: TODO                    # użytkownik na hostach
    ansible_ssh_private_key_file: TODO    # ścieżka do klucza prywatnego SSH
    # Hosty labowe dostają nowy klucz hosta przy każdym starcie, więc nie zapisujemy go w known_hosts.
    # Na prawdziwych serwerach tej linii nie używamy.
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    # Python na hostach podany wprost; bez tej linii Ansible przy każdym uruchomieniu ostrzega o wykrytym /usr/bin/python3.12
    ansible_python_interpreter: /usr/bin/python3

  children:
    webservers:            # grupa nadrzędna: wszystkie serwery WWW
      children:
        dev:               # środowisko deweloperskie
          hosts:
            web01:
              ansible_host: TODO    # adres hosta web01
              ansible_port: TODO    # port SSH hosta web01
        prod:              # produkcja
          hosts:
            web02:
              ansible_host: TODO    # adres hosta web02
              ansible_port: TODO    # port SSH hosta web02
