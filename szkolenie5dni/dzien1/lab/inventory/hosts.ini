# L1 — inventory w formacie INI: to samo co hosts.yml obok. Używasz jednego albo drugiego:
#   ansible all -i inventory/hosts.ini -m ping
# Uzupełnij miejsca TODO. Dane połączenia dostaniesz od prowadzącego
# (na środowisku z lab-env są w pliku lab-env/inventory.yml).

[all:vars]
# użytkownik na hostach
ansible_user=TODO
# ścieżka do klucza prywatnego SSH
ansible_ssh_private_key_file=TODO
# Hosty labowe dostają nowy klucz hosta przy każdym starcie, więc nie zapisujemy go w known_hosts.
# Na prawdziwych serwerach tej linii nie używamy.
ansible_ssh_common_args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
# Python na hostach podany wprost; bez tej linii Ansible przy każdym uruchomieniu ostrzega o wykrytym /usr/bin/python3.12
ansible_python_interpreter=/usr/bin/python3

# środowisko deweloperskie: adres i port SSH hosta web01
[dev]
web01 ansible_host=TODO ansible_port=TODO

# produkcja: adres i port SSH hosta web02
[prod]
web02 ansible_host=TODO ansible_port=TODO

# grupa nadrzędna: wszystkie serwery WWW
[webservers:children]
dev
prod
