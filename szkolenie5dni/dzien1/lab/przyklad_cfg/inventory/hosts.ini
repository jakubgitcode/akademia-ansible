# To samo co hosts.yml obok, w formacie INI (w ansible.cfg zmień inventory = inventory/hosts.ini).
# Hosty bez grupy byłyby PRZED pierwszą sekcją; tu wszystkie są w grupach.

[all:vars]
srodowisko=akademia
lokalizacja=frankfurt

# Twój komputer: zadania lokalne (bez SSH)
[lokalnie]
localhost ansible_connection=local ansible_python_interpreter="{{ ansible_playbook_python }}"

[dev]
web01 ansible_host=127.0.0.1 ansible_port=2221

[prod]
web02 ansible_host=127.0.0.1 ansible_port=2222

[webservers:children]
dev
prod

# Ten sam host może być w kilku grupach
[monitoring]
web01
web02
