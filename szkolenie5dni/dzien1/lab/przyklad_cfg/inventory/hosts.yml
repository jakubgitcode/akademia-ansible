---
# Inventory przykładu: te same hosty co w labie (web01, web02 w lab-env) plus localhost.
# Dane połączenia nie są tutaj, tylko w group_vars/all.yml — plik hostów zostaje krótki.
#   ansible-inventory --graph
#   ansible-inventory --host web02          # wszystkie zmienne hosta po połączeniu plików
all:
  vars:
    srodowisko: akademia
    lokalizacja: frankfurt

  children:
    # Twój komputer: zadania lokalne (bez SSH)
    lokalnie:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

    webservers:
      children:
        dev:
          hosts:
            web01:
              ansible_host: 127.0.0.1
              ansible_port: 2221
        prod:
          hosts:
            web02:
              ansible_host: 127.0.0.1
              ansible_port: 2222

    # Ten sam host może być w kilku grupach: grupy według roli, środowiska, miejsca, monitoringu…
    monitoring:
      hosts:
        web01:
        web02:
