# Drugi przykład ansible.cfg: rozbudowany, w stylu projektów prowadzącego (L1 część B, krok 8).
# Pierwszy, minimalny jest w ../ansible.cfg.odpowiedz. Tu każde ustawienie ma komentarz;
# linie z "# " na początku to przydatne opcje do włączenia.
#   cd przyklad_cfg
#   ansible-config dump --only-changed     # co zmienia ten plik względem ustawień domyślnych
#   ansible-config list | less             # wszystkie ustawienia z opisami
#   ansible-config init --disabled > pelny.cfg   # pełny wzorzec (wszystko zakomentowane)

[defaults]
# Domyślne inventory. group_vars/ i host_vars/ obok hosts.yml Ansible wczytuje sam.
inventory = inventory/hosts.yml
# to samo w formacie INI: inventory = inventory/hosts.ini

# Python na hostach podany wprost: bez ostrzeżeń o wykrytym interpreterze.
# (localhost ma w inventory własny: Python z venv, w którym działa Ansible)
interpreter_python = /usr/bin/python3

# Ile hostów naraz (domyślnie 5). Więcej = szybciej na dużym inventory, ale więcej procesów na Twoim komputerze.
forks = 10

# Fakty: "smart" zbiera je tylko wtedy, gdy nie ma ich w cache. Cache w plikach JSON (jeden plik na host),
# ważny godzinę — drugie uruchomienie w tym czasie pomija "Gathering Facts".
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/fakty
fact_caching_timeout = 3600

# Gdzie szukać ról: najpierw katalog projektu, potem katalog użytkownika i systemowe.
roles_path = roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles

# Wyniki zadań jako YAML (wieloliniowo, czytelniej niż JSON) i czasy zadań na końcu (kolekcja ansible.posix).
# Dawniej: stdout_callback = yaml i callback_whitelist — w nowych wersjach już nie działają.
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks

# Nie pytaj o klucz nowego hosta. TYLKO w labie (kontenery tworzone od nowa mają nowe klucze);
# na produkcji zostaw True i dopisz klucze do known_hosts.
host_key_checking = False

# Nie pokazuj hostów, na których zadanie zostało pominięte (when: …) — krótszy wynik.
# display_skipped_hosts = False
# Zamiast ansible_user w inventory:
# remote_user = ubuntu
# Dzień 4 (vault): plik z hasłem, żeby nie pisać --ask-vault-pass:
# vault_password_file = ~/.ansible/vault_pass.txt

[inventory]
# Które wtyczki inventory wolno użyć, w tej kolejności prób. "auto" czyta pliki wtyczek, np. aws_ec2.yml.
enable_plugins = host_list, script, auto, yaml, ini, toml

[privilege_escalation]
# become = True    # sudo w KAŻDYM zadaniu — lepiej "become: true" tylko tam, gdzie trzeba
become_method = sudo

[ssh_connection]
# Mniej połączeń SSH na zadanie = szybciej (wymaga sudo bez requiretty; na Ubuntu domyślnie OK).
pipelining = True
# Domyślne: jedno połączenie SSH na host, utrzymywane 60 s. Dłużej = szybciej przy długich playbookach.
# ssh_args = -C -o ControlMaster=auto -o ControlPersist=300s

[diff]
# always = True    # jakby każde polecenie miało --diff
context = 3
